plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/los-implementadores/PrintScript")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "5m" // initial heap size
    maxHeapSize = "7m" // maximum heap size
}

dependencies {
    testImplementation 'junit:junit:4.13.1'
    implementation 'org.printscript:common:1.1.0-SNAPSHOT'
    implementation 'org.printscript:lexer:1.1.0-SNAPSHOT'
    implementation 'org.printscript:parser:1.1.0-SNAPSHOT'
    implementation 'org.printscript:interpreter:1.1.0-SNAPSHOT'
    implementation 'org.printscript:formatter:1.1.0-SNAPSHOT'
    implementation 'org.printscript:analyzer:1.1.0-SNAPSHOT'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
